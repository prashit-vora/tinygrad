name: macOS tqdm diagnostic
on:
  workflow_dispatch:
    inputs:
      subject_ref:
        description: 'Commit or branch with the original single-sample test'
        required: true
        default: 'a7a5ee0789457a8000b24cc97467df1bd8db52d2'
        type: string
      runner:
        description: 'macOS runner pool (recorded in results)'
        required: true
        default: 'macos-26'
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-15-intel
      mode:
        description: 'Observation mode (profiling adds substantial overhead)'
        required: true
        default: 'observe'
        type: choice
        options:
          - observe
          - profile
          - io
          - terminal-ab
          - trace-capabilities
      repetitions:
        description: 'Number of attempts (1 to 1000000)'
        required: true
        default: '10000'
        type: string
permissions:
  contents: read
jobs:
  repeat-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      SPEC: '2'
      DEV: 'NULL'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: prashit-vora/tinygrad
          ref: ${{ inputs.subject_ref }}
          path: subject
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'
      - name: Install matching minimal dependencies
        run: python -m pip install numpy==2.5.4 tqdm==4.70.1
      - name: Record timings, context switches and GC overlap
        if: inputs.mode == 'observe'
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject
          REPETITIONS: ${{ inputs.repetitions }}
        run: python ../.github/scripts/tqdm_diagnostic.py ../diagnostic-results --count "$REPETITIONS" --probe ../.github/scripts/context_switch_probe.py
      - name: Profile CPU work after one warmup
        if: inputs.mode == 'profile'
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject
          REPETITIONS: ${{ inputs.repetitions }}
        run: python ../.github/scripts/tqdm_profile.py ../diagnostic-results --count "$REPETITIONS"
      - name: Measure terminal and output operations
        if: inputs.mode == 'io'
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject
          REPETITIONS: ${{ inputs.repetitions }}
        run: python ../.github/scripts/tqdm_io_probe.py ../diagnostic-results --count "$REPETITIONS"
      - name: Compare real and fixed terminal-size lookup
        if: inputs.mode == 'terminal-ab'
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject
          REPETITIONS: ${{ inputs.repetitions }}
        run: python ../.github/scripts/tqdm_terminal_ab.py ../diagnostic-results --count "$REPETITIONS"
      - name: Inspect hosted macOS tracing capabilities
        if: inputs.mode == 'trace-capabilities'
        run: python .github/scripts/macos_trace_capabilities.py diagnostic-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tqdm-macos-results
          path: diagnostic-results/
