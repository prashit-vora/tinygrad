name: macOS tqdm diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat-test:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SPEC: '2'
      DEV: 'NULL'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: prashit-vora/tinygrad
          ref: a7a5ee0789457a8000b24cc97467df1bd8db52d2
          path: subject
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'
      - name: Install matching minimal dependencies
        run: python -m pip install numpy==2.5.4 tqdm==4.70.1
      - name: Repeat unchanged test
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject
        run: python ../.github/scripts/tqdm_diagnostic.py ../diagnostic-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tqdm-macos-results
          path: diagnostic-results/
